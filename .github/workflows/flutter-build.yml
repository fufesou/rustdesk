name: Package the existing Linux build for Arch

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "test-linux-wayland-16676"

permissions:
  contents: write

env:
  TAG_NAME: "${{ inputs.upload-tag }}"
  TEST_PACKAGE: "RustDesk-test-261023-b4af82157"
  SOURCE_COMMIT: "b4af82157bc5b44b62e66c1e7b50cc945bc42532"
  VERSION: "1.4.9"
  TEST_DEB_SHA256: "1dc2dfdc44f874c47147fa58e90fb3f63b313bc7e63999b1cea26d6a82663747"

jobs:
  build-arch-package:
    name: package Arch x86_64 from the verified Linux build
    runs-on: ubuntu-22.04
    steps:
      - name: Read historical packaging files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          sparse-checkout: res

      - name: Restore the verified Flutter bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "${TEST_PACKAGE}-x86_64.deb" --dir "$RUNNER_TEMP/input"
          deb="$RUNNER_TEMP/input/${TEST_PACKAGE}-x86_64.deb"
          printf '%s  %s\n' "$TEST_DEB_SHA256" "$deb" | sha256sum --check -
          test "$(dpkg-deb -f "$deb" Package)" = rustdesk
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          bundle=flutter/build/linux/x64/release/bundle
          mkdir -p "$bundle"
          for item in rustdesk data lib; do
            cp -a "$RUNNER_TEMP/deb/usr/share/rustdesk/$item" "$bundle/"
          done

      - name: Build archlinux package
        uses: rustdesk-org/arch-makepkg-action@04200739ed1d0bf6f2188b6736b26a767c57a7f9
        with:
          packages:
          scripts: |
            cd res && HBB=`pwd`/.. FLUTTER=1 makepkg -f

      - name: Name diagnostic Arch package
        if: inputs.upload-artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          copy_package() {
            local destination="$1"; shift
            if [ "$#" -ne 1 ]; then
              echo "::error::Expected one package for $destination, found $#"
              exit 1
            fi
            if [ ! -s "$1" ]; then
              echo "::error::Missing or empty package: $1"
              exit 1
            fi
            cp -- "$1" "$destination"
          }
          copy_package "${RUNNER_TEMP}/${TEST_PACKAGE}-x86_64.pkg.tar.zst" res/rustdesk-[0-9]*-x86_64.pkg.tar.zst
      - name: Verify the Arch package and its executable code
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${TEST_PACKAGE}-x86_64.pkg.tar.zst"
          mkdir -p "$RUNNER_TEMP/arch"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/arch"
          grep -Fx 'pkgname = rustdesk' "$RUNNER_TEMP/arch/.PKGINFO"
          grep -Fx "pkgver = ${VERSION}-0" "$RUNNER_TEMP/arch/.PKGINFO"
          grep -Fx 'arch = x86_64' "$RUNNER_TEMP/arch/.PKGINFO"
          test "$(readlink "$RUNNER_TEMP/arch/usr/bin/rustdesk")" = /usr/share/rustdesk/rustdesk
          diff -qr "$RUNNER_TEMP/deb/usr/share/rustdesk/data" "$RUNNER_TEMP/arch/usr/share/rustdesk/data"
          for file in rustdesk lib/librustdesk.so lib/libapp.so; do
            objcopy --dump-section ".text=$RUNNER_TEMP/input.text" \
              "$RUNNER_TEMP/deb/usr/share/rustdesk/$file" "$RUNNER_TEMP/input.elf"
            objcopy --dump-section ".text=$RUNNER_TEMP/output.text" \
              "$RUNNER_TEMP/arch/usr/share/rustdesk/$file" "$RUNNER_TEMP/output.elf"
            cmp "$RUNNER_TEMP/input.text" "$RUNNER_TEMP/output.text"
            echo "Verified executable code: $file"
          done
          for file in rustdesk.service rustdesk.desktop rustdesk-link.desktop; do
            cmp "res/$file" "$RUNNER_TEMP/arch/usr/share/rustdesk/files/$file"
          done

      - name: Publish archlinux package
        if: inputs.upload-artifact
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/${{ env.TEST_PACKAGE }}-x86_64.pkg.tar.zst
