name: Build the flutter version of the RustDesk

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "test-windows-service-150-151"

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
  TEST_PACKAGE: "RustDesk-test-261104-C-f705902ec-x86_64"
  SOURCE_COMMIT: "f705902ec3dc2a4fc65d5d8a65cf99c026b8a135"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    runs-on: windows-2022
    steps:
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk-org/RustDeskTempTopMostWindow
          ref: ecd8d6a139eee76845ea66423fb739af450fda90
          path: RustDeskTempTopMostWindow
      - name: Build WindowInjection
        working-directory: RustDeskTempTopMostWindow
        run: msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topmostwindow-artifacts-x64
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll
          if-no-files-found: error

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Verify historical source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD^) -ne $env:SOURCE_COMMIT) { throw 'Unexpected source parent' }
          $allowed = @('.github/workflows/bridge.yml', '.github/workflows/flutter-build.yml', '.github/workflows/flutter-nightly.yml')
          $changes = @(git diff --name-only $env:SOURCE_COMMIT HEAD)
          if (@($changes | Where-Object { $_ -notin $allowed }).Count) { throw 'Application source differs from the stated commit' }

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          foreach ($relative in @('flutter/build/windows/x64/runner/Release', 'rustdesk', 'usbmmidd_v2')) {
            if (-not [IO.Path]::GetFullPath($relative).StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe build staging path' }
          }
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          if ($LASTEXITCODE -ne 0) { throw 'RustDesk compilation failed' }
          $lockDiff = (git diff -- Cargo.lock flutter/pubspec.lock | Out-String)
          [IO.File]::WriteAllText((Join-Path $PWD 'dependency-lockfiles.patch'), $lockDiff)
          mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                throw "Printer driver checksum mismatch"
            } else {
                throw "Printer adapter checksum mismatch"
            }
          } catch {
              throw
          }

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.upload-artifact }}
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
          path: "./rustdesk"

      - name: Sign rustdesk files
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

      - name: Copy executable version resource
        shell: pwsh
        run: |
          $resources = @(Get-ChildItem './flutter/build/windows/x64/runner' -Filter Runner.res -Recurse -File)
          if ($resources.Count -ne 1) { throw 'Expected one compiled Runner.res' }
          Copy-Item -LiteralPath $resources[0].FullName -Destination './libs/portable/Runner.res'

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set -e
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/${{ env.TEST_PACKAGE }}.exe

      - name: Sign test executable
        if: env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          set -e
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

      - name: Record package provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Get-Item -LiteralPath "./SignOutput/$env:TEST_PACKAGE.exe"
          $version = (Get-Item -LiteralPath './rustdesk/rustdesk.exe').VersionInfo.FileVersion
          if (-not $version.StartsWith($env:VERSION)) { throw 'Unexpected payload version' }
          $probe = Start-Process -FilePath './rustdesk/rustdesk.exe' -ArgumentList '--version' -WindowStyle Hidden -RedirectStandardOutput './payload-version.txt' -PassThru
          if (-not $probe.WaitForExit(15000)) { Stop-Process -Id $probe.Id; throw 'Payload version probe timed out' }
          $reported = (Get-Content -LiteralPath './payload-version.txt' -Raw).Trim()
          if ($probe.ExitCode -ne 0 -or -not $reported.StartsWith($env:VERSION)) { throw 'Payload version probe failed' }
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          if ($env:SIGN_BASE_URL -ne '-2' -and $signature.Status -ne 'Valid') { throw 'Test executable signing failed' }
          $payloadSignatures = @{}
          foreach ($name in @('rustdesk.exe', 'librustdesk.dll')) {
            $status = (Get-AuthenticodeSignature -LiteralPath "./rustdesk/$name").Status.ToString()
            if ($env:SIGN_BASE_URL -ne '-2' -and $status -ne 'Valid') { throw "Payload signing failed: $name" }
            $payloadSignatures[$name] = $status
          }
          $inputs = @{}
          foreach ($name in @('windows-x64-release.zip', 'usbmmidd_v2.zip', 'rustdesk_printer_driver_v4-1.4.zip', 'printer_driver_adapter.zip')) {
            $inputs[$name] = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item -LiteralPath "./flutter/pubspec.lock" -Destination "./SignOutput/$env:TEST_PACKAGE.pubspec.lock"
          Copy-Item -LiteralPath "./dependency-lockfiles.patch" -Destination "./SignOutput/$env:TEST_PACKAGE.dependencies.patch"
          $metadata = [ordered]@{
            dependency_lockfiles_changed=((Get-Item ./dependency-lockfiles.patch).Length -gt 0)
            pubspec_lock_sha256=(Get-FileHash ./flutter/pubspec.lock -Algorithm SHA256).Hash.ToLowerInvariant()
            source_commit=$env:SOURCE_COMMIT; workflow_commit=(git rev-parse HEAD)
            hbb_common_commit=(git -C libs/hbb_common rev-parse HEAD)
            executable=$file.Name; file_version=$version; sha256=$hash; bytes=$file.Length
            authenticode=$signature.Status.ToString(); payload_authenticode=$payloadSignatures; reported_version=$reported
            rust=(rustc --version); flutter=$env:FLUTTER_VERSION; runner_image=$env:ImageVersion
            downloaded_inputs=$inputs; vcpkg_commit=$env:VCPKG_COMMIT_ID
            build_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath "./SignOutput/$env:TEST_PACKAGE.json" -Encoding utf8
          "$hash  $($file.Name)" | Set-Content -LiteralPath "./SignOutput/$env:TEST_PACKAGE.sha256" -Encoding ascii

      - name: Upload test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.TEST_PACKAGE }}
          path: ./SignOutput/${{ env.TEST_PACKAGE }}.*
          if-no-files-found: error
          retention-days: 14
