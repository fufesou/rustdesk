name: Complete the 1.4.6 test update release
on:
  workflow_dispatch:
  push:
    branches:
      - run/complete-test-update-release
permissions:
  contents: write
concurrency:
  group: complete-test-update-release
  cancel-in-progress: false
env:
  SOURCE_REF: 4a04f715cb13aae7a2bae49d9e2dc99d08b634c2
  TARGET_REPOSITORY: fufesou/rustdesk
  RELEASE_ID: fix-update-metadata
  VERSION: "1.4.6"
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.44.0"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: 120deac3062162151622ca4860575a33844ba10b
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
jobs:
  generate-arm64-bridge:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout 1.4.6 source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
      - name: Install bridge prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake gcc g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Generate Flutter 3.44 bridge
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-update-1.4.6-arm64-bridge
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
  build-windows-arm64:
    needs: generate-arm64-bridge
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - name: Export cache environment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Checkout 1.4.6 source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-update-1.4.6-arm64-bridge
          path: ./
      - name: Checkout topmost helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk-org/RustDeskTempTopMostWindow
          ref: ecd8d6a139eee76845ea66423fb739af450fda90
          path: topmost
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build topmost helper
        run: msbuild .\topmost\WindowInjection\WindowInjection.vcxproj -p:Configuration=Release -p:Platform=ARM64 /p:TargetVersion=Windows10
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}
      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - name: Select native ARM64 Flutter engine
        run: |
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          $dartVersion = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
          if ($dartVersion -notmatch "windows_arm64") { throw "Expected ARM64 Dart SDK: $dartVersion" }
          & "$flutterRoot\bin\flutter.bat" precache --windows
          if (-not (Test-Path "$flutterRoot\bin\cache\artifacts\engine\windows-arm64-release")) {
            throw "Flutter ARM64 engine is missing"
          }
      - name: Patch source for Flutter 3.44
        shell: bash
        run: bash .github/patches/apply_flutter_3.44_source_patches.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-pc-windows-msvc
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows-static
        run: $VCPKG_ROOT/vcpkg install --triplet arm64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - name: Build ARM64 application
        shell: bash
        run: |
          export SODIUM_LIB_DIR="$VCPKG_ROOT/installed/arm64-windows-static/lib"
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec
          mv ./flutter/build/windows/arm64/runner/Release ./rustdesk
      - name: Add package resources
        run: Copy-Item .\topmost\WindowInjection\ARM64\Release\WindowInjection.dll .\rustdesk\
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13", architecture: arm64 }
      - name: Install locked release dependencies
        shell: bash
        run: 'git fetch --no-tags --depth=1 origin "$GITHUB_SHA" && git show "${GITHUB_SHA}:res/test_update_release_requirements.txt" > .release-requirements.txt && git show "${GITHUB_SHA}:res/test_update_release_brotli_requirements.txt" > .release-brotli-requirements.txt && python -m venv .release-venv && .release-venv/Scripts/python.exe -m pip install --only-binary=:all: --require-hashes -r .release-requirements.txt && .release-venv/Scripts/python.exe -m pip install --no-build-isolation --no-deps --no-binary=:all: --require-hashes -r .release-brotli-requirements.txt'
      - name: Sign application files
        shell: bash
        env: { SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2", SIGN_SECRET_KEY: "${{ secrets.SIGN_SECRET_KEY }}" }
        run: |
          if [[ "$SIGN_BASE_URL" == "-2" || -z "$SIGN_SECRET_KEY" ]]; then
            echo "Signing service configuration is missing" >&2
            exit 1
          fi
          BASE_URL="$SIGN_BASE_URL" SECRET_KEY="$SIGN_SECRET_KEY" .release-venv/Scripts/python.exe res/job.py sign_files ./rustdesk
      - name: Build EXE and MSI
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd libs/portable
          ../../.release-venv/Scripts/python.exe generate.py -f ../../rustdesk -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir SignOutput
          mv target/release/rustdesk-portable-packer.exe "SignOutput/rustdesk-${VERSION}-aarch64.exe"
          pushd res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=ARM64 /p:TargetVersion=Windows10
          msi=$(find Package/bin -path '*/Release/en-us/Package.msi' -print -quit)
          test -n "$msi"
          mv "$msi" "../../SignOutput/rustdesk-${VERSION}-aarch64.msi"
      - name: Sign packages
        shell: bash
        env: { SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2", SIGN_SECRET_KEY: "${{ secrets.SIGN_SECRET_KEY }}" }
        run: BASE_URL="$SIGN_BASE_URL" SECRET_KEY="$SIGN_SECRET_KEY" .release-venv/Scripts/python.exe res/job.py sign_files ./SignOutput
      - name: Verify ARM64 packages
        run: |
          $exe = ".\SignOutput\rustdesk-$env:VERSION-aarch64.exe"
          $msi = ".\SignOutput\rustdesk-$env:VERSION-aarch64.msi"
          $signedPaths = @($exe, $msi) + @(Get-ChildItem .\rustdesk -Recurse -Include *.exe,*.dll | Select-Object -ExpandProperty FullName)
          foreach ($path in $signedPaths) {
            if (-not (Test-Path $path)) { throw "Missing package: $path" }
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne "Valid") { throw "Invalid signature for ${path}: $($signature.Status)" }
          }
          foreach ($armPath in @($exe, ".\rustdesk\rustdesk.exe")) {
            if ((& llvm-readobj --file-headers $armPath | Out-String) -notmatch "IMAGE_FILE_MACHINE_ARM64") { throw "Not ARM64: $armPath" }
          }
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne $env:VERSION) { throw "Unexpected EXE version: $productVersion" }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $readOnly = 0
          $msiTemplateProperty = 7
          $database = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @((Resolve-Path $msi).Path, $readOnly))
          $view = $database.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $database, "SELECT ``Value`` FROM ``Property`` WHERE ``Property``='ProductVersion'")
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
          $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
          $msiVersion = $record.GetType().InvokeMember("StringData", "GetProperty", $null, $record, 1)
          $expectedMsiVersion = "^$([regex]::Escape($env:VERSION))\.\d+$"
          if ($msiVersion -notmatch $expectedMsiVersion) { throw "Unexpected MSI version: $msiVersion" }
          $summary = $database.GetType().InvokeMember("SummaryInformation", "GetProperty", $null, $database, @($readOnly))
          $template = $summary.GetType().InvokeMember("Property", "GetProperty", $null, $summary, @($msiTemplateProperty))
          if ($template -notmatch "(?i)^Arm64(?:;|$)") { throw "Unexpected MSI platform: $template" }
      - name: Upload ARM64 packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-update-1.4.6-windows-aarch64
          path: SignOutput/rustdesk-${{ env.VERSION }}-aarch64.*
  publish-complete-metadata:
    needs: build-windows-arm64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Restrict release target
        run: test "$GITHUB_REPOSITORY" = "$TARGET_REPOSITORY"
      - name: Checkout metadata source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install metadata dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update_metadata_requirements.txt'
      - name: Download ARM64 packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-update-1.4.6-windows-aarch64
          path: artifacts
      - name: Download existing release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_ID" --repo "$TARGET_REPOSITORY" --dir artifacts \
            --pattern "rustdesk-${VERSION}-x86_64.exe" --pattern "rustdesk-${VERSION}-x86_64.msi" \
            --pattern "rustdesk-${VERSION}-x86-sciter.exe" --pattern "rustdesk-${VERSION}-aarch64.dmg" \
            --pattern "rustdesk-${VERSION}-x86_64.dmg"
      - name: Generate, sign, and verify metadata
        shell: bash
        env:
          RUSTDESK_UPDATE_GITHUB_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$RUSTDESK_UPDATE_ED25519_SEED" || -z "$RUSTDESK_UPDATE_ED25519_PUBLIC_KEY" ]]; then
            echo "Update metadata signing configuration is missing" >&2
            exit 1
          fi
          python res/generate_update_metadata.py check-key
          sign_args=()
          artifact_args=()
          while read -r platform arch format file; do
            test -f "artifacts/$file"
            sign_args+=(--artifact "$platform" "$arch" "$format" "artifacts/$file")
            artifact_args+=(--artifact "artifacts/$file")
          done <<EOF
          windows x86_64 exe rustdesk-${VERSION}-x86_64.exe
          windows x86_64 msi rustdesk-${VERSION}-x86_64.msi
          windows aarch64 exe rustdesk-${VERSION}-aarch64.exe
          windows aarch64 msi rustdesk-${VERSION}-aarch64.msi
          windows x86 exe rustdesk-${VERSION}-x86-sciter.exe
          macos aarch64 dmg rustdesk-${VERSION}-aarch64.dmg
          macos x86_64 dmg rustdesk-${VERSION}-x86_64.dmg
          EOF
          published_at=$(gh release view "$RELEASE_ID" --repo "$TARGET_REPOSITORY" --json publishedAt --jq .publishedAt)
          python res/generate_update_metadata.py sign "${sign_args[@]}" --version "$VERSION" --release-id "$RELEASE_ID" --published-at "$published_at" --metadata-out rustdesk-update.json --signature-out rustdesk-update.json.sig
          python res/generate_update_metadata.py verify --metadata rustdesk-update.json --signature rustdesk-update.json.sig "${artifact_args[@]}" --version "$VERSION" --release-id "$RELEASE_ID"
      - name: Publish ARM64 packages before metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_ID" "artifacts/rustdesk-${VERSION}-aarch64.exe" "artifacts/rustdesk-${VERSION}-aarch64.msi" --repo "$TARGET_REPOSITORY" --clobber
      - name: Publish signed metadata last
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_ID" rustdesk-update.json rustdesk-update.json.sig --repo "$TARGET_REPOSITORY" --clobber
