name: Test rust-toolchain non-host toolchains

on:
  push:
    branches: [test/CI]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-host:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: nightly-2023-10-13-i686-pc-windows-msvc
      UNUSABLE_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
    steps:
      - run: rustup --version
      - name: Install the non-host toolchain without an extra input
        uses: fufesou/rust-toolchain@b38a663c5df0fd5ac7bb65ded7b02a3f7af3b636
        with:
          toolchain: ${{ env.TEST_TOOLCHAIN }}
          targets: i686-pc-windows-msvc
          components: rustfmt
      - name: Verify the active default toolchain and compiler host
        run: |
          test "$(rustup show active-toolchain)" = "$TEST_TOOLCHAIN (default)"
          rustc --version --verbose | grep -Fx 'host: i686-pc-windows-msvc'
          rustfmt --version
      - name: Try a toolchain that cannot run on Windows
        id: incompatible
        continue-on-error: true
        uses: fufesou/rust-toolchain@b38a663c5df0fd5ac7bb65ded7b02a3f7af3b636
        with:
          toolchain: ${{ env.UNUSABLE_TOOLCHAIN }}
      - name: Verify the incompatible toolchain failed after installation
        if: always()
        env:
          OUTCOME: ${{ steps.incompatible.outcome }}
        run: |
          test "$OUTCOME" = failure
          test "$(rustup show active-toolchain)" = "$UNUSABLE_TOOLCHAIN (default)"
